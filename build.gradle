plugins {
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'ml.shadniw.mods'
version = '1.1.0'

base {
    archivesName = 'LittleSun'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.1.172'

    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }

        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
        }
    }

    mods {
        littlesun {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'io.github.llamalad7:mixinextras-neoforge:0.4.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
                'MixinConfigs': 'mixins.littlesun.json',
                'Specification-Title': 'littlesun',
                'Specification-Vendor': 'ShadniW',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'ShadniW'
        ])
    }
}
